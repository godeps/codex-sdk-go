name: stress

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned Codex reference
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: bb5054fe47abe73ecbbd454751066a28c89f4bb9
          path: _reference/codex
          sparse-checkout: sdk/python
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run 30 minute stress suite
        shell: bash
        run: scripts/ci/run_stress.sh artifacts/evidence/stress/stress-summary.json

      - name: Upload stress summary
        uses: actions/upload-artifact@v4
        with:
          name: stress-summary
          path: artifacts/evidence/stress/stress-summary.json

  protocol-fuzz:
    name: protocol-fuzz-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzClientRequestUnmarshal
          - FuzzServerRequestUnmarshal
          - FuzzServerNotificationUnmarshal
          - FuzzThreadItemUnmarshal
          - FuzzRequestIDUnmarshal
          - FuzzThreadListCwdFilterUnmarshal
          - FuzzAuthModeUnmarshal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz generated protocol family for ten minutes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence/stress
          fuzz_dir="$(mktemp -d "${RUNNER_TEMP}/codex-protocol-fuzz.XXXXXX")"
          cleanup() {
            find "$fuzz_dir" -type f -delete
            find "$fuzz_dir" -depth -type d -empty -delete
          }
          trap cleanup EXIT
          mkdir -p "$fuzz_dir/cache"
          GOWORK=off go test -c -fuzz '^${{ matrix.target }}$' -o "$fuzz_dir/protocol.test" ./protocol
          # Go's internal duration deadline can race worker teardown and report
          # context.DeadlineExceeded after a clean run. Keep that deadline in
          # reserve and stop with SIGINT after the required budget plus grace.
          timeout --preserve-status --signal=INT --kill-after=1m 615s \
            "$fuzz_dir/protocol.test" \
              -test.timeout=16m \
              -test.run='^$' \
              -test.fuzz='^${{ matrix.target }}$' \
              -test.fuzzcachedir="$fuzz_dir/cache" \
              -test.fuzztime=15m
          cat > "artifacts/evidence/stress/${{ matrix.target }}.json" <<JSON
          {
            "fuzzTarget": "${{ matrix.target }}",
            "fuzzTime": "10m",
            "harnessWallTime": "10m15s",
            "durationControl": "external-sigint",
            "package": "./protocol"
          }
          JSON

      - name: Upload fuzz summary
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-${{ matrix.target }}
          path: artifacts/evidence/stress/${{ matrix.target }}.json

  aggregate-evidence:
    runs-on: ubuntu-24.04
    needs:
      - stress
      - protocol-fuzz
    permissions:
      contents: read
    steps:
      - name: Download stress summary
        uses: actions/download-artifact@v4
        with:
          name: stress-summary
          path: artifacts/evidence/stress

      - name: Download protocol fuzz summaries
        uses: actions/download-artifact@v4
        with:
          pattern: "protocol-fuzz-*"
          path: artifacts/evidence/stress
          merge-multiple: true

      - name: Verify combined stress evidence shape
        shell: bash
        run: |
          test -f artifacts/evidence/stress/stress-summary.json
          test "$(find artifacts/evidence/stress -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" = "8"

      - name: Upload stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: stress-evidence
          path: artifacts/evidence/stress
