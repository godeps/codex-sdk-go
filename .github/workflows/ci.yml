name: ci

on:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned Codex reference
        uses: actions/checkout@v7
        with:
          repository: openai/codex
          ref: bb5054fe47abe73ecbbd454751066a28c89f4bb9
          path: _reference/codex
          sparse-checkout: sdk/python
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify runtime workflow dependencies exist
        shell: bash
        run: |
          test -f .github/workflows/runtime-native.yml
          test -f .github/workflows/runtime-tests.yml

      - name: Verify formatting
        shell: bash
        run: |
          diff_file="$RUNNER_TEMP/gofmt.diff"
          GOWORK=off gofmt -d . | tee "$diff_file"
          test ! -s "$diff_file"

      - name: Run go vet
        shell: bash
        run: GOWORK=off go vet ./...

      - name: Run unit and package tests
        shell: bash
        run: GOWORK=off go test ./...

      - name: Run race tests
        shell: bash
        run: GOWORK=off go test -race ./...

      - name: Run integration-tagged tests
        shell: bash
        run: GOWORK=off go test -tags=integration ./...

      - name: Install and run static analysis
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOWORK=off go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$RUNNER_TEMP/bin/staticcheck" ./...

      - name: Install and run govulncheck
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOWORK=off go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$RUNNER_TEMP/bin/govulncheck" ./...

      - name: Verify protocol generator drift
        shell: bash
        run: GOWORK=off go run ./cmd/codex-sdk-gen verify

      - name: Run protocol fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          fuzz_dir="$(mktemp -d "${RUNNER_TEMP}/codex-protocol-fuzz-smoke.XXXXXX")"
          cleanup() {
            find "$fuzz_dir" -type f -delete
            find "$fuzz_dir" -depth -type d -empty -delete
          }
          trap cleanup EXIT
          GOWORK=off go test -c -fuzz '^FuzzClientRequestUnmarshal$' -o "$fuzz_dir/protocol.test" ./protocol
          # Leave the internal deadline in reserve and use SIGINT for clean
          # worker teardown after the smoke budget plus startup grace.
          fuzz_smoke() {
            local target=$1
            local cache="$fuzz_dir/cache-$target"
            mkdir -p "$cache"
            timeout --preserve-status --signal=INT --kill-after=30s 15s \
              "$fuzz_dir/protocol.test" \
                -test.timeout=2m \
                -test.run='^$' \
                -test.fuzz="^${target}$" \
                -test.fuzzcachedir="$cache" \
                -test.fuzztime=1m
          }
          fuzz_smoke FuzzClientRequestUnmarshal
          fuzz_smoke FuzzServerRequestUnmarshal
          fuzz_smoke FuzzThreadItemUnmarshal
          fuzz_smoke FuzzServerNotificationUnmarshal
          fuzz_smoke FuzzRequestIDUnmarshal
          fuzz_smoke FuzzThreadListCwdFilterUnmarshal
          fuzz_smoke FuzzAuthModeUnmarshal

      - name: Repeat race on concurrency and lifecycle suites
        shell: bash
        run: GOWORK=off go test -race -count=20 . ./internal/appserver ./internal/router ./internal/runtimebin

      - name: Collect coverage profiles
        shell: bash
        run: |
          mkdir -p artifacts/evidence/ci
          GOWORK=off go test -covermode=atomic -coverprofile "$RUNNER_TEMP/root.cover" .
          GOWORK=off go test -covermode=atomic -coverprofile "$RUNNER_TEMP/appserver.cover" ./internal/appserver
          GOWORK=off go test -covermode=atomic -coverprofile "$RUNNER_TEMP/router.cover" ./internal/router
          GOWORK=off go test -covermode=atomic -coverprofile "$RUNNER_TEMP/runtimebin.cover" ./internal/runtimebin
          GOWORK=off go run ./scripts/ci/coverage_gate \
            --output artifacts/evidence/ci/coverage.json \
            --gate ".:85:$RUNNER_TEMP/root.cover" \
            --gate "./internal/appserver:90:$RUNNER_TEMP/appserver.cover" \
            --gate "./internal/router:90:$RUNNER_TEMP/router.cover" \
            --gate "./internal/runtimebin:90:$RUNNER_TEMP/runtimebin.cover"

      - name: Write machine-readable CI evidence
        shell: bash
        run: |
          mkdir -p artifacts/evidence/ci
          cat > artifacts/evidence/ci/ci-evidence.json <<JSON
          {
            "workflowName": "ci",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "goVersion": "$(go version | sed 's/"/\\"/g')",
            "staticAnalyzer": "staticcheck",
            "vulnerabilityScanner": "govulncheck",
            "requiredRuntimeWorkflows": [
              "stress",
              "runtime-tests",
              "runtime-native"
            ],
            "evidence": {
              "pinnedPythonDispositionTest": "TestPythonDispositionCoversPinnedPythonTests"
            },
            "commands": [
              "GOWORK=off gofmt -d .",
              "GOWORK=off go vet ./...",
              "GOWORK=off go test ./...",
              "GOWORK=off go test -race ./...",
              "GOWORK=off go test -tags=integration ./...",
              "staticcheck ./...",
              "govulncheck ./...",
              "GOWORK=off go run ./cmd/codex-sdk-gen verify",
              "GOWORK=off go test -c -fuzz '^FuzzClientRequestUnmarshal$' -o protocol.test ./protocol",
              "timeout --preserve-status --signal=INT --kill-after=30s 15s protocol.test -test.fuzz='<target>' -test.fuzztime=1m (7 targets)",
              "GOWORK=off go test -race -count=20 . ./internal/appserver ./internal/router ./internal/runtimebin"
            ]
          }
          JSON

      - name: Upload CI evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence
          path: artifacts/evidence/ci
